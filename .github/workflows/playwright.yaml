name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Set up environment variables
      run: |
        cp .env.example .env
        echo 'NEXT_PUBLIC_BASE_URI="http://localhost:3001/"' >> .env
        echo 'NEXT_PUBLIC_MANIFEST_RESOURCE_URI="resource.ttl"' >> .env
        echo 'NEXT_PUBLIC_ADMIN_WEBID="http://localhost:3001/test/profile/card#me"' >> .env
        echo 'NEXT_PUBLIC_OIDC_ISSUER="http://localhost:3000"' >> .env
        
    - name: Build LDO types
      run: npm run build:ldo
      continue-on-error: true
      
    - name: Run Playwright tests
      run: npm run test:e2e
      
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
