name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Set up environment variables
      run: |
        cp .env.example .env
        echo 'NEXT_PUBLIC_BASE_URI="http://localhost:3001/"' >> .env
        echo 'NEXT_PUBLIC_MANIFEST_RESOURCE_URI="resource.ttl"' >> .env
        echo 'NEXT_PUBLIC_ADMIN_WEBID="http://localhost:3001/test/profile/card#me"' >> .env
        echo 'NEXT_PUBLIC_OIDC_ISSUER="http://localhost:3000"' >> .env
        
    - name: Build LDO types
      run: npm run build:ldo
      # Note: LDO build may fail in CI due to network restrictions when fetching remote contexts.
      # The generated types should already be committed to the repository.
      # If this step fails but types exist in src/ldo/, tests can still run.
      
    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.shardIndex }}
        path: playwright-report/
        retention-days: 30
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.shardIndex }}
        path: test-results/
        retention-days: 30

  merge-reports:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
        
    - name: Download all test reports
      uses: actions/download-artifact@v4
      with:
        pattern: playwright-report-*
        path: all-reports
        merge-multiple: true
        
    - name: Upload merged report
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-merged
        path: all-reports/
        retention-days: 30
